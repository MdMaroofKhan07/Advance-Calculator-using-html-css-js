<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputBox">
        <div>
            <button class="special_operator">AC</button>
            <button class="special_operator">DEL</button>
            <button class="operator">π</button>
            <button class="operator">(</button>
            <button class="operator">)</button>
        </div>
        <div>
            <button class="operator">sin</button>
            <button class="operator">cos</button>
            <button class="operator">tan</button>
            <button class="operator">log</button>
            <button class="operator">ln</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            <button class="operator">%</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button class="operator">^</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="operator">√</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="operator">/</button>
            <button class="equalBtn">=</button>
        </div>
    </div>
    
    <div class="history-container">
        <h3>History</h3>
        <div id="history"></div>
        <button id="clearHistory">Clear History</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
